apiVersion: v1
kind: ServiceAccount
metadata:
  name: daddy-app
  namespace: daddy
  labels:
    app.kubernetes.io/part-of: daddy
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: daddy-app-role
  namespace: daddy
  labels:
    app.kubernetes.io/part-of: daddy
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["postgres-secret", "app-secret"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: daddy-app-binding
  namespace: daddy
  labels:
    app.kubernetes.io/part-of: daddy
subjects:
  - kind: ServiceAccount
    name: daddy-app
    namespace: daddy
roleRef:
  kind: Role
  name: daddy-app-role
  apiGroup: rbac.authorization.k8s.io
