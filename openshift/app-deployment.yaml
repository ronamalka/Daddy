apiVersion: apps/v1
kind: Deployment
metadata:
  name: daddy-app
  namespace: daddy
  labels:
    app: daddy-app
    app.kubernetes.io/part-of: daddy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: daddy-app
  template:
    metadata:
      labels:
        app: daddy-app
    spec:
      serviceAccountName: daddy-app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
      containers:
        - name: daddy-app
          image: IMAGE_REGISTRY/daddy:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: daddy-app-secret
                  key: AUTH_SECRET
            - name: AUTH_URL
              valueFrom:
                secretKeyRef:
                  name: daddy-app-secret
                  key: AUTH_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: daddy-app-secret
                  key: REDIS_URL
            - name: INTER_SERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: daddy-app-secret
                  key: INTER_SERVICE_SECRET
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
