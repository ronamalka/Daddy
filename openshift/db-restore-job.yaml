apiVersion: batch/v1
kind: Job
metadata:
  name: daddy-db-restore
  namespace: daddy
  labels:
    app: daddy-app
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: daddy-db-restore
    spec:
      restartPolicy: Never
      containers:
        - name: restore
          image: postgres:16-alpine
          command: ["sh", "-c"]
          args:
            - |
              echo "Restoring database from backup..."
              PGPASSWORD=$POSTGRES_PASSWORD psql -h postgres -U $POSTGRES_USER -d $POSTGRES_DB < /backup/daddy-backup.sql
              echo "Restore completed."
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
          volumeMounts:
            - name: backup-volume
              mountPath: /backup
      volumes:
        - name: backup-volume
          configMap:
            name: daddy-db-backup
