# Microservice ports are NOT exposed to the host.
# All traffic must go through the Next.js BFF (port 3000).
# Only PostgreSQL is exposed for local dev tooling (psql, pgAdmin).

services:
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: daddy
      POSTGRES_PASSWORD: daddypass123
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daddy"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - daddy-net

  users-service:
    build:
      context: .
      dockerfile: services/users/Dockerfile
    # No ports exposed — reachable only via internal network
    environment:
      PORT: "4001"
      DATABASE_URL: postgres://daddy:daddypass123@postgres:5432/daddy_users
      INTER_SERVICE_SECRET: ${INTER_SERVICE_SECRET:-dev-secret-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - daddy-net

  gigs-service:
    build:
      context: .
      dockerfile: services/gigs/Dockerfile
    environment:
      PORT: "4002"
      DATABASE_URL: postgres://daddy:daddypass123@postgres:5432/daddy_gigs
      INTER_SERVICE_SECRET: ${INTER_SERVICE_SECRET:-dev-secret-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - daddy-net

  orders-service:
    build:
      context: .
      dockerfile: services/orders/Dockerfile
    environment:
      PORT: "4003"
      DATABASE_URL: postgres://daddy:daddypass123@postgres:5432/daddy_orders
      INTER_SERVICE_SECRET: ${INTER_SERVICE_SECRET:-dev-secret-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - daddy-net

  requests-service:
    build:
      context: .
      dockerfile: services/requests/Dockerfile
    environment:
      PORT: "4004"
      DATABASE_URL: postgres://daddy:daddypass123@postgres:5432/daddy_requests
      INTER_SERVICE_SECRET: ${INTER_SERVICE_SECRET:-dev-secret-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - daddy-net

volumes:
  pgdata:

networks:
  daddy-net:
    driver: bridge
