apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: redis
    app.kubernetes.io/part-of: daddy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          # Cache only. OpenShift assigns a random UID that cannot write the
          # image's /data, so a default RDB bgsave fails and Redis then refuses
          # all writes (MISCONF), which breaks login.
          command:
            - /bin/sh
            - -c
            - 'redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru --save "" --appendonly no --stop-writes-on-bgsave-error no'
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app: redis
    app.kubernetes.io/part-of: daddy
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
