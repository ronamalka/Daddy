apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-service
  labels:
    app: orders-service
    app.kubernetes.io/part-of: daddy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-service
  template:
    metadata:
      labels:
        app: orders-service
    spec:
      containers:
        - name: orders-service
          image: quay.io/rh_ee_rmalka/daddy-orders-service:9066a4f1
          ports:
            - containerPort: 4003
          env:
            - name: PORT
              value: "4003"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: ORDERS_DATABASE_URL
            - name: SERVICE_NAME
              value: "orders"
            - name: INTER_SERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: daddy-app-secret
                  key: INTER_SERVICE_SECRET
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: daddy-app-secret
                  key: SENTRY_DSN
          resources:
            requests:
              memory: "64Mi"
              cpu: "10m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 4003
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 4003
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: orders-service
  labels:
    monitoring: daddy
spec:
  selector:
    app: orders-service
  ports:
    - port: 4003
      targetPort: 4003
      name: http
