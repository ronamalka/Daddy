# Pod Disruption Budgets for all Daddy services
# Ensures at least 1 pod stays available during voluntary disruptions
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: daddy-app-pdb
  labels:
    app: daddy-app
    app.kubernetes.io/part-of: daddy
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: daddy-app
---
