apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: daddy-alerting-rules
  labels:
    app: daddy
    app.kubernetes.io/part-of: daddy
    prometheus: k8s
    role: alert-rules
spec:
  groups:
    - name: daddy-service-health
      rules:
        # ------------------------------------------------------------------
        # Service down: no metrics scraped for > 2 minutes
        # ------------------------------------------------------------------
        - alert: DaddyServiceDown
          expr: up{job=~".*daddy.*"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Service {{ $labels.job }} is down"
            description: >
              The target {{ $labels.instance }} in job {{ $labels.job }}
              has been unreachable for more than 2 minutes.

        # ------------------------------------------------------------------
        # High error rate: > 5% of responses are 5xx over 5 minutes
        # ------------------------------------------------------------------
        - alert: DaddyHighErrorRate
          expr: |
            (
              sum by (service) (
                rate(daddy_http_requests_total{status_code=~"5.."}[5m])
              )
              /
              sum by (service) (
                rate(daddy_http_requests_total[5m])
              )
            ) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High 5xx error rate on {{ $labels.service }}"
            description: >
              Service {{ $labels.service }} has a 5xx error rate above 5%
              for the last 5 minutes (current: {{ $value | humanizePercentage }}).

        # ------------------------------------------------------------------
        # High latency: P95 response time > 2 seconds over 5 minutes
        # ------------------------------------------------------------------
        - alert: DaddyHighLatency
          expr: |
            histogram_quantile(0.95,
              sum by (service, le) (
                rate(daddy_http_request_duration_seconds_bucket[5m])
              )
            ) > 2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "P95 latency above 2s on {{ $labels.service }}"
            description: >
              The 95th percentile response time for {{ $labels.service }}
              has exceeded 2 seconds for the last 5 minutes
              (current: {{ $value | humanizeDuration }}).

        # ------------------------------------------------------------------
        # Pod restart loop: > 3 restarts in 10 minutes
        # ------------------------------------------------------------------
        - alert: DaddyPodRestartLoop
          expr: |
            increase(
              kube_pod_container_status_restarts_total{
                namespace=~"daddy-.*"
              }[10m]
            ) > 3
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} is restart-looping"
            description: >
              Container {{ $labels.container }} in pod {{ $labels.pod }}
              (namespace {{ $labels.namespace }}) has restarted more than
              3 times in the last 10 minutes.

        # ------------------------------------------------------------------
        # High memory usage: > 80% of container memory limit
        # ------------------------------------------------------------------
        - alert: DaddyHighMemoryUsage
          expr: |
            (
              container_memory_working_set_bytes{namespace=~"daddy-.*", container!=""}
              /
              container_spec_memory_limit_bytes{namespace=~"daddy-.*", container!=""}
            ) > 0.8
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High memory usage in {{ $labels.pod }}/{{ $labels.container }}"
            description: >
              Container {{ $labels.container }} in pod {{ $labels.pod }}
              is using {{ $value | humanizePercentage }} of its memory limit
              for the last 5 minutes.

    - name: daddy-backup-health
      rules:
        # ------------------------------------------------------------------
        # Backup job failed
        # ------------------------------------------------------------------
        - alert: DaddyBackupFailed
          expr: |
            kube_job_status_failed{
              namespace=~"daddy-.*",
              job_name=~"db-backup.*"
            } > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "Database backup job failed"
            description: >
              The database backup CronJob in namespace {{ $labels.namespace }}
              has failed. Check job logs: oc logs job/{{ $labels.job_name }}
              -n {{ $labels.namespace }}.

        # ------------------------------------------------------------------
        # No successful backup in 26 hours (daily schedule + buffer)
        # ------------------------------------------------------------------
        - alert: DaddyBackupMissing
          expr: |
            (time() - kube_cronjob_status_last_successful_time{
              namespace=~"daddy-.*",
              cronjob="db-backup"
            }) > 93600
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "No successful database backup in 26 hours"
            description: >
              The last successful database backup in namespace
              {{ $labels.namespace }} was more than 26 hours ago.
              Expected: daily at 02:00 UTC.
