apiVersion: apps/v1
kind: Deployment
metadata:
  name: daddy-app
  labels:
    app: daddy-app
    app.kubernetes.io/part-of: daddy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: daddy-app
  template:
    metadata:
      labels:
        app: daddy-app
    spec:
      containers:
        - name: daddy-app
          image: quay.io/rh_ee_rmalka/daddy-app:75e9ada6
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: daddy-app-secret
                  key: AUTH_SECRET
            - name: AUTH_URL
              valueFrom:
                secretKeyRef:
                  name: daddy-app-secret
                  key: AUTH_URL
            - name: AUTH_TRUST_HOST
              value: "true"
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: daddy-app-secret
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: daddy-app-secret
                  key: GOOGLE_CLIENT_SECRET
            - name: NEXT_PUBLIC_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: daddy-app-secret
                  key: NEXT_PUBLIC_BASE_URL
            - name: USERS_SERVICE_URL
              value: "http://users-service:4001"
            - name: GIGS_SERVICE_URL
              value: "http://gigs-service:4002"
            - name: ORDERS_SERVICE_URL
              value: "http://orders-service:4003"
            - name: REQUESTS_SERVICE_URL
              value: "http://requests-service:4004"
            - name: CHAT_SERVICE_URL
              value: "http://chat-service:4005"
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: INTER_SERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: daddy-app-secret
                  key: INTER_SERVICE_SECRET
            - name: GOOGLE_SITE_VERIFICATION
              value: "foF9T4nW2AM4XjB2S0gq7wkQNiPB9Poq4i4IBryBYUo"
            - name: NEXT_PUBLIC_UMAMI_WEBSITE_ID
              valueFrom:
                secretKeyRef:
                  name: daddy-app-secret
                  key: NEXT_PUBLIC_UMAMI_WEBSITE_ID
            - name: NEXT_PUBLIC_UMAMI_URL
              valueFrom:
                secretKeyRef:
                  name: daddy-app-secret
                  key: NEXT_PUBLIC_UMAMI_URL
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: daddy-app-secret
                  key: SENTRY_DSN
            - name: NEXT_PUBLIC_SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: daddy-app-secret
                  key: NEXT_PUBLIC_SENTRY_DSN
          resources:
            requests:
              memory: "128Mi"
              cpu: "10m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
