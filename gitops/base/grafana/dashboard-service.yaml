apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-service
data:
  per-service.json: |
    {
      "uid": "daddy-per-service",
      "title": "Daddy — Per-Service Deep Dive",
      "tags": ["daddy", "service"],
      "timezone": "browser",
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "service",
            "type": "custom",
            "current": { "text": "app", "value": "app" },
            "options": [
              { "text": "app", "value": "app", "selected": true },
              { "text": "users", "value": "users" },
              { "text": "gigs", "value": "gigs" },
              { "text": "orders", "value": "orders" },
              { "text": "requests", "value": "requests" },
              { "text": "chat", "value": "chat" }
            ],
            "query": "app,users,gigs,orders,requests,chat",
            "label": "Service"
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Request Rate by Endpoint",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(daddy_http_requests_total{service=\"$service\"}[5m])) by (route, method)",
              "legendFormat": "{{method}} {{route}}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        },
        {
          "id": 2,
          "title": "Error Rate by Endpoint",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "sum(rate(daddy_http_requests_total{service=\"$service\", status_code=~\"[45]..\"}[5m])) by (route, status_code)",
              "legendFormat": "{{status_code}} {{route}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "color": { "mode": "palette-classic" }
            }
          }
        },
        {
          "id": 3,
          "title": "Success Rate (%)",
          "type": "gauge",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            {
              "expr": "1 - (sum(rate(daddy_http_requests_total{service=\"$service\", status_code=~\"5..\"}[5m])) / sum(rate(daddy_http_requests_total{service=\"$service\"}[5m])))",
              "legendFormat": "Success Rate"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "value": null, "color": "red" },
                  { "value": 0.95, "color": "yellow" },
                  { "value": 0.99, "color": "green" }
                ]
              }
            }
          }
        },
        {
          "id": 4,
          "title": "Latency by Endpoint (P50 / P95 / P99)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 16 },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(daddy_http_request_duration_seconds_bucket{service=\"$service\"}[5m])) by (le, route))",
              "legendFormat": "P50 {{route}}"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(daddy_http_request_duration_seconds_bucket{service=\"$service\"}[5m])) by (le, route))",
              "legendFormat": "P95 {{route}}"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(daddy_http_request_duration_seconds_bucket{service=\"$service\"}[5m])) by (le, route))",
              "legendFormat": "P99 {{route}}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "id": 5,
          "title": "Latency Heatmap",
          "type": "heatmap",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 24 },
          "targets": [
            {
              "expr": "sum(increase(daddy_http_request_duration_seconds_bucket{service=\"$service\"}[5m])) by (le)",
              "legendFormat": "{{le}}",
              "format": "heatmap"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s" } },
          "options": {
            "calculate": false,
            "yAxis": { "unit": "s" },
            "color": { "scheme": "Oranges" }
          }
        },
        {
          "id": 6,
          "title": "CPU Usage",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 32 },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=~\"daddy-.*\", pod=~\".*$service.*\", container!=\"\"}[5m])) by (pod)",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "percentunit" } }
        },
        {
          "id": 7,
          "title": "Memory Usage",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 32 },
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{namespace=~\"daddy-.*\", pod=~\".*$service.*\", container!=\"\"}) by (pod)",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes" } }
        }
      ],
      "schemaVersion": 39
    }
