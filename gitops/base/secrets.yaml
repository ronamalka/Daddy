apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  labels:
    app: postgres
    app.kubernetes.io/part-of: daddy
type: Opaque
stringData:
  POSTGRES_USER: daddy
  POSTGRES_PASSWORD: daddy-dev-password
  POSTGRES_DB: daddy
  DATABASE_URL: postgresql://daddy:daddy-dev-password@postgres:5432/daddy
  USERS_DATABASE_URL: postgresql://daddy:daddy-dev-password@postgres:5432/daddy_users
  GIGS_DATABASE_URL: postgresql://daddy:daddy-dev-password@postgres:5432/daddy_gigs
  ORDERS_DATABASE_URL: postgresql://daddy:daddy-dev-password@postgres:5432/daddy_orders
  REQUESTS_DATABASE_URL: postgresql://daddy:daddy-dev-password@postgres:5432/daddy_requests
  CHAT_DATABASE_URL: postgresql://daddy:daddy-dev-password@postgres:5432/daddy_chat
---
apiVersion: v1
kind: Secret
metadata:
  name: daddy-app-secret
  labels:
    app: daddy-app
    app.kubernetes.io/part-of: daddy
type: Opaque
stringData:
  # --- Argo-managed keys (safe to sync) ---
  AUTH_URL: https://REPLACE_WITH_ROUTE_HOST
  NEXT_PUBLIC_BASE_URL: https://REPLACE_WITH_ROUTE_HOST
  NEXT_PUBLIC_UMAMI_WEBSITE_ID: ""
  NEXT_PUBLIC_UMAMI_URL: ""
  SENTRY_DSN: ""
  NEXT_PUBLIC_SENTRY_DSN: ""
  # --- Sensitive keys: NOT in git, create via oc patch per namespace ---
  # AUTH_SECRET, INTER_SERVICE_SECRET, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
  # GRAFANA_ADMIN_PASSWORD, UMAMI_DATABASE_URL
  #
  # First deploy per namespace:
  #   oc patch secret daddy-app-secret -n <ns> --type merge \
  #     -p '{"stringData":{"AUTH_SECRET":"<value>","INTER_SERVICE_SECRET":"<value>",
  #          "GOOGLE_CLIENT_ID":"<value>","GOOGLE_CLIENT_SECRET":"<value>"}}'
