# Alertmanager configuration for routing Prometheus alerts
# Requires: alertmanager deployed (OpenShift built-in or standalone)
#
# After deploying, configure the webhook URLs:
#   oc patch secret alertmanager-config -n <ns> --type merge \
#     -p '{"stringData":{
#       "SLACK_WEBHOOK_CRITICAL":"https://hooks.slack.com/services/...",
#       "SLACK_WEBHOOK_WARNING":"https://hooks.slack.com/services/..."
#     }}'
---
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-config
  labels:
    app: alertmanager
    app.kubernetes.io/part-of: daddy
type: Opaque
stringData:
  SLACK_WEBHOOK_CRITICAL: "REPLACE_VIA_OC_PATCH"
  SLACK_WEBHOOK_WARNING: "REPLACE_VIA_OC_PATCH"
---
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: daddy-alert-routing
  labels:
    app: daddy
    app.kubernetes.io/part-of: daddy
    alertmanagerConfig: daddy
spec:
  route:
    receiver: slack-warning
    groupBy:
      - alertname
      - service
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    routes:
      - receiver: slack-critical
        matchers:
          - name: severity
            value: critical
            matchType: "="
        repeatInterval: 1h
        continue: false
      - receiver: slack-warning
        matchers:
          - name: severity
            value: warning
            matchType: "="
        repeatInterval: 4h
        continue: false
  receivers:
    - name: slack-critical
      slackConfigs:
        - apiURL:
            name: alertmanager-config
            key: SLACK_WEBHOOK_CRITICAL
          channel: "#daddy-alerts-critical"
          sendResolved: true
          title: |
            [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}
          text: |
            *Alert:* {{ .CommonLabels.alertname }}
            *Severity:* {{ .CommonLabels.severity }}
            *Service:* {{ .CommonLabels.service }}
            *Description:* {{ .CommonAnnotations.description }}
            *Runbook:* Check gitops/base/prometheus-rules.yaml for alert definitions
          color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
    - name: slack-warning
      slackConfigs:
        - apiURL:
            name: alertmanager-config
            key: SLACK_WEBHOOK_WARNING
          channel: "#daddy-alerts"
          sendResolved: true
          title: |
            [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}
          text: |
            *Alert:* {{ .CommonLabels.alertname }}
            *Severity:* {{ .CommonLabels.severity }}
            *Service:* {{ .CommonLabels.service }}
            *Description:* {{ .CommonAnnotations.description }}
          color: '{{ if eq .Status "firing" }}warning{{ else }}good{{ end }}'
