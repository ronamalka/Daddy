apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
  labels:
    app: chat-service
    app.kubernetes.io/part-of: daddy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-service
  template:
    metadata:
      labels:
        app: chat-service
    spec:
      containers:
        - name: chat-service
          image: quay.io/rh_ee_rmalka/daddy-chat-service:2f221012
          ports:
            - containerPort: 4005
          env:
            - name: PORT
              value: "4005"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: CHAT_DATABASE_URL
            - name: INTER_SERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: daddy-app-secret
                  key: INTER_SERVICE_SECRET
          resources:
            requests:
              memory: "64Mi"
              cpu: "10m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 4005
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 4005
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: chat-service
  labels:
    monitoring: daddy
spec:
  selector:
    app: chat-service
  ports:
    - port: 4005
      targetPort: 4005
      name: http
