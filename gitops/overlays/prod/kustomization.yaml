apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: daddy-prod

resources:
  - ../../base
  - network-policy.yaml

patches:
  - target:
      kind: Deployment
      name: daddy-app
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Secret
      name: daddy-app-secret
    patch: |
      - op: replace
        path: /stringData/AUTH_URL
        value: https://daddy-app-daddy-prod.apps.cluster-x8bxx.x8bxx.sandbox2963.opentlc.com
      - op: replace
        path: /stringData/NEXT_PUBLIC_BASE_URL
        value: https://daddy-app-daddy-prod.apps.cluster-x8bxx.x8bxx.sandbox2963.opentlc.com
      - op: replace
        path: /stringData/AUTH_SECRET
        value: CHANGE_ME_PROD_AUTH_SECRET_AT_LEAST_32_CHARS
      - op: replace
        path: /stringData/INTER_SERVICE_SECRET
        value: CHANGE_ME_PROD_INTER_SERVICE_SECRET
  - target:
      kind: Secret
      name: postgres-secret
    patch: |
      - op: replace
        path: /stringData/POSTGRES_PASSWORD
        value: CHANGE_ME_PROD_PASSWORD
      - op: replace
        path: /stringData/DATABASE_URL
        value: postgresql://daddy:CHANGE_ME_PROD_PASSWORD@postgres:5432/daddy
      - op: replace
        path: /stringData/USERS_DATABASE_URL
        value: postgresql://daddy:CHANGE_ME_PROD_PASSWORD@postgres:5432/daddy_users
      - op: replace
        path: /stringData/GIGS_DATABASE_URL
        value: postgresql://daddy:CHANGE_ME_PROD_PASSWORD@postgres:5432/daddy_gigs
      - op: replace
        path: /stringData/ORDERS_DATABASE_URL
        value: postgresql://daddy:CHANGE_ME_PROD_PASSWORD@postgres:5432/daddy_orders
      - op: replace
        path: /stringData/REQUESTS_DATABASE_URL
        value: postgresql://daddy:CHANGE_ME_PROD_PASSWORD@postgres:5432/daddy_requests
      - op: replace
        path: /stringData/CHAT_DATABASE_URL
        value: postgresql://daddy:CHANGE_ME_PROD_PASSWORD@postgres:5432/daddy_chat
  - target:
      kind: PersistentVolumeClaim
      name: postgres-data
    patch: |
      - op: replace
        path: /spec/resources/requests/storage
        value: 10Gi

labels:
  - pairs:
      environment: prod
