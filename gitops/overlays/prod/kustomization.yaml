apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: daddy-prod

resources:
  - ../../base
  - network-policy.yaml
  - app-route-custom.yaml
  - certificate.yaml
  - router-rbac.yaml
  - umami-route.yaml

patches:
  # HPA manages replicas — set deployment to 2 as baseline (HPA overrides)
  - target:
      kind: Deployment
      name: daddy-app
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
  # Secrets are NOT patched here — they must be set manually in the cluster:
  #   oc patch secret daddy-app-secret -n daddy-prod --type merge \
  #     -p '{"stringData":{"AUTH_SECRET":"...","GOOGLE_CLIENT_ID":"...","GOOGLE_CLIENT_SECRET":"...","INTER_SERVICE_SECRET":"..."}}'
  #   oc patch secret postgres-secret -n daddy-prod --type merge \
  #     -p '{"stringData":{"POSTGRES_PASSWORD":"...","DATABASE_URL":"postgresql://daddy:<pw>@postgres:5432/daddy",...}}'
  - target:
      kind: Secret
      name: daddy-app-secret
    patch: |
      - op: replace
        path: /stringData/AUTH_URL
        value: https://aballeh.com
      - op: replace
        path: /stringData/NEXT_PUBLIC_BASE_URL
        value: https://aballeh.com
  - target:
      kind: PersistentVolumeClaim
      name: postgres-data
    patch: |
      - op: replace
        path: /spec/resources/requests/storage
        value: 10Gi
  # Prod HPA: min 2, max 10 for main app; min 2, max 8 for microservices (base defaults)
  # Prod backups: larger PVC
  - target:
      kind: PersistentVolumeClaim
      name: db-backups
    patch: |
      - op: replace
        path: /spec/resources/requests/storage
        value: 20Gi

labels:
  - pairs:
      environment: prod
