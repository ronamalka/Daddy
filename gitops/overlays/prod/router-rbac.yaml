apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aballeh-tls-reader
  labels:
    app.kubernetes.io/part-of: daddy
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["aballeh-tls"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aballeh-tls-reader
  labels:
    app.kubernetes.io/part-of: daddy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aballeh-tls-reader
subjects:
  - kind: ServiceAccount
    name: router
    namespace: openshift-ingress
