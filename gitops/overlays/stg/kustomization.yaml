apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: daddy-stg

resources:
  - ../../base
  - network-policy.yaml

# Secrets are NOT patched here — they must be set manually in the cluster:
#   oc patch secret daddy-app-secret -n daddy-stg --type merge \
#     -p '{"stringData":{"AUTH_SECRET":"...","INTER_SERVICE_SECRET":"..."}}'
#   oc patch secret postgres-secret -n daddy-stg --type merge \
#     -p '{"stringData":{"POSTGRES_PASSWORD":"...","DATABASE_URL":"..."}}'

patches:
  - target:
      kind: Deployment
      name: daddy-app
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Secret
      name: daddy-app-secret
    patch: |
      - op: replace
        path: /stringData/AUTH_URL
        value: https://daddy-app-daddy-stg.apps.cluster-x8bxx.x8bxx.sandbox2963.opentlc.com
      - op: replace
        path: /stringData/NEXT_PUBLIC_BASE_URL
        value: https://daddy-app-daddy-stg.apps.cluster-x8bxx.x8bxx.sandbox2963.opentlc.com
  - target:
      kind: Route
      name: grafana
    patch: |
      - op: replace
        path: /spec/host
        value: grafana-daddy-stg.apps.cluster-x8bxx.x8bxx.sandbox2963.opentlc.com
      - op: remove
        path: /metadata/annotations/cert-utils-operator.redhat-cop.io~1certs-from-secret
  - target:
      kind: Deployment
      name: grafana
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: "https://grafana-daddy-stg.apps.cluster-x8bxx.x8bxx.sandbox2963.opentlc.com"
  - target:
      kind: PersistentVolumeClaim
      name: postgres-data
    patch: |
      - op: replace
        path: /spec/resources/requests/storage
        value: 5Gi

labels:
  - pairs:
      environment: stg
