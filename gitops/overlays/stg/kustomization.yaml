apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: daddy-stg

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: daddy-app
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: quay.io/rh_ee_rmalka/daddy:stg

labels:
  - pairs:
      environment: stg
