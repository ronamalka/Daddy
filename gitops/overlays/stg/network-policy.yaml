apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  labels:
    app.kubernetes.io/part-of: daddy
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# OpenShift DNS pods listen on 5353. A default-deny that only allows :53 never
# reaches dns-default, so getaddrinfo fails (Google OAuth, postgres, data.gov.il).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-openshift-dns
  labels:
    app.kubernetes.io/part-of: daddy
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - port: 5353
          protocol: UDP
        - port: 5353
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-bff-ingress
  labels:
    app.kubernetes.io/part-of: daddy
spec:
  podSelector:
    matchLabels:
      app: daddy-app
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 3000
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-bff-egress
  labels:
    app.kubernetes.io/part-of: daddy
spec:
  podSelector:
    matchLabels:
      app: daddy-app
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: users-service
      ports:
        - port: 4001
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: gigs-service
      ports:
        - port: 4002
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: orders-service
      ports:
        - port: 4003
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: requests-service
      ports:
        - port: 4004
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: chat-service
      ports:
        - port: 4005
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - port: 6379
          protocol: TCP
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Google OAuth token exchange and other HTTPS APIs
    - ports:
        - port: 443
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-services-to-postgres
  labels:
    app.kubernetes.io/part-of: daddy
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: daddy-app
        - podSelector:
            matchLabels:
              app: users-service
        - podSelector:
            matchLabels:
              app: gigs-service
        - podSelector:
            matchLabels:
              app: orders-service
        - podSelector:
            matchLabels:
              app: requests-service
        - podSelector:
            matchLabels:
              app: chat-service
        - podSelector:
            matchLabels:
              app: umami
      ports:
        - port: 5432
          protocol: TCP
---
