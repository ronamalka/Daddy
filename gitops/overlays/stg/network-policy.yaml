apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-services-egress
  labels:
    app.kubernetes.io/part-of: daddy
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - users-service
          - gigs-service
          - orders-service
          - requests-service
          - chat-service
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
          protocol: TCP
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # users-service refreshes the city catalog from data.gov.il
    - ports:
        - port: 443
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-services-ingress
  labels:
    app.kubernetes.io/part-of: daddy
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - users-service
          - gigs-service
          - orders-service
          - requests-service
          - chat-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: daddy-app
      ports:
        - port: 4001
          protocol: TCP
        - port: 4002
          protocol: TCP
        - port: 4003
          protocol: TCP
        - port: 4004
          protocol: TCP
        - port: 4005
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
