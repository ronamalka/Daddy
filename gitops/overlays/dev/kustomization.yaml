apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: daddy-dev

resources:
  - ../../base

components:
  - ../../components/seed-job

patches:
  # HPA manages replicas — set deployment to 1 as baseline (HPA overrides)
  - target:
      kind: Deployment
      name: daddy-app
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Secret
      name: daddy-app-secret
    patch: |
      - op: replace
        path: /stringData/AUTH_URL
        value: https://daddy-app-daddy-dev.apps.cluster-x8bxx.x8bxx.sandbox2963.opentlc.com
      - op: replace
        path: /stringData/NEXT_PUBLIC_BASE_URL
        value: https://daddy-app-daddy-dev.apps.cluster-x8bxx.x8bxx.sandbox2963.opentlc.com
  # Dev HPA: min 1, max 3 for all services
  - target:
      kind: HorizontalPodAutoscaler
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
  # Dev backups: weekly instead of daily, 3-day retention
  - target:
      kind: CronJob
      name: db-backup
    patch: |
      - op: replace
        path: /spec/schedule
        value: "0 2 * * 0"
  # Smaller backup PVC for dev
  - target:
      kind: PersistentVolumeClaim
      name: db-backups
    patch: |
      - op: replace
        path: /spec/resources/requests/storage
        value: 2Gi

labels:
  - pairs:
      environment: dev
