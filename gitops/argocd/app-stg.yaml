apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: daddy-stg
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: daddy
spec:
  project: daddy
  source:
    repoURL: https://github.com/ronamalka/Daddy.git
    targetRevision: stg
    path: gitops/overlays/stg
  destination:
    server: https://kubernetes.default.svc
    namespace: daddy-stg
  ignoreDifferences:
    - group: ""
      kind: Secret
      jsonPointers:
        - /data
        - /stringData
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
