name: "CI: Seed Image"

on:
  push:
    branches: [main, dev, stg]
    paths:
      - "prisma/**"
      - "Dockerfile.seed"
      - ".github/workflows/ci-seed.yml"
  pull_request:
    branches: [main, dev, stg]
    paths:
      - "prisma/**"
      - "Dockerfile.seed"
      - ".github/workflows/ci-seed.yml"
  workflow_dispatch:

concurrency:
  group: ci-seed-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: quay.io
  IMAGE_NAME: ${{ secrets.QUAY_USER }}/daddy

jobs:
  build-and-push:
    name: Build & Push Seed Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/stg' || github.ref == 'refs/heads/main')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Quay.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USER }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Determine image tag
        id: tag
        run: echo "sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.seed
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-seed:${{ steps.tag.outputs.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-seed:${{ github.ref_name }}
          cache-from: type=gha,scope=seed
          cache-to: type=gha,mode=max,scope=seed
