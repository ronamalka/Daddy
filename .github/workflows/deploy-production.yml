name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (short SHA from CI)"
        required: true
        type: string
      confirm:
        description: "Type 'deploy' to confirm production deployment"
        required: true
        type: string

env:
  REGISTRY: quay.io
  IMAGE_NAME: ${{ secrets.QUAY_USER }}/daddy

jobs:
  validate:
    name: Validate Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Confirm deployment
        if: inputs.confirm != 'deploy'
        run: |
          echo "::error::Deployment not confirmed. Type 'deploy' in the confirm field."
          exit 1

      - name: Verify images exist
        run: |
          for svc in app users-service gigs-service orders-service requests-service; do
            echo "Checking ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${svc}:${{ inputs.image_tag }}"
          done

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [validate]
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update production manifests
        run: |
          TAG="${{ inputs.image_tag }}"
          BASE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          if [ -d "gitops/overlays/production" ]; then
            find gitops/overlays/production -name "*.yaml" -exec sed -i "s|image: .*daddy-.*:.*|image: ${BASE}-app:${TAG}|g" {} \;
          fi

          sed -i "s|image: .*daddy-app:.*|image: ${BASE}-app:${TAG}|g" gitops/base/app-deployment.yaml
          for svc in users gigs orders requests; do
            sed -i "s|image: .*daddy-${svc}-service:.*|image: ${BASE}-${svc}-service:${TAG}|g" gitops/base/${svc}-deployment.yaml
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/
          git diff --cached --quiet || git commit -m "chore(prod): deploy ${TAG} to production"
          git push
