name: Release to production

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Short SHA already pinned in gitops/base on main"
        required: true
        type: string
      confirm:
        description: "Type 'deploy' to confirm production image retag"
        required: true
        type: string

env:
  REGISTRY: quay.io
  IMAGE_NAME: ${{ secrets.QUAY_USER }}/daddy

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Confirm manual dispatch
        if: github.event_name == 'workflow_dispatch' && inputs.confirm != 'deploy'
        run: |
          echo "::error::Deployment not confirmed. Type 'deploy' in the confirm field."
          exit 1

      - uses: actions/checkout@v4

      - name: Read image SHA from GitOps
        id: tag
        run: |
          set -euo pipefail
          PINNED=$(grep -E 'image: .*daddy-app:' gitops/base/app-deployment.yaml | tail -1 | awk -F: '{print $NF}')
          if [ -z "$PINNED" ]; then
            echo "::error::Could not read daddy-app image tag from gitops/base/app-deployment.yaml"
            exit 1
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHA="${{ inputs.image_tag }}"
            VERSION="manual-${SHA}"
            if [ "$SHA" != "$PINNED" ]; then
              echo "::error::Input SHA ${SHA} does not match GitOps pin ${PINNED} on this ref."
              exit 1
            fi
          else
            SHA="$PINNED"
            VERSION="${GITHUB_REF_NAME}"
          fi

          echo "sha=${SHA}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          for svc in users gigs orders requests chat; do
            grep -q "daddy-${svc}-service:${SHA}" "gitops/base/${svc}-deployment.yaml"
          done

          echo "GitOps pins ${SHA}; version tag will be ${VERSION}"

  retag:
    name: Tag production images
    runs-on: ubuntu-latest
    needs: [validate]
    environment: production
    steps:
      - name: Log in to Quay.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USER }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Retag SHA images as prod and version
        run: |
          set -euo pipefail
          SHA="${{ needs.validate.outputs.sha }}"
          VERSION="${{ needs.validate.outputs.version }}"
          BASE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          for svc in app users-service gigs-service orders-service requests-service chat-service; do
            SRC="${BASE}-${svc}:${SHA}"
            echo "Retagging ${SRC} -> :prod and :${VERSION}"
            docker buildx imagetools create \
              --tag "${BASE}-${svc}:prod" \
              --tag "${BASE}-${svc}:${VERSION}" \
              "${SRC}"
          done

          echo "::notice::Images ${SHA} are now also tagged :prod and :${VERSION}."
          echo "::notice::Sync Argo CD app daddy-prod (manual). Desired state is gitops/overlays/prod on main."
