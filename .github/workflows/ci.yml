name: CI

on:
  push:
    branches: [main, dev, develop, feature/*]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  REGISTRY: quay.io
  IMAGE_NAME: ${{ secrets.QUAY_USER }}/daddy

jobs:
  typecheck-gateway:
    name: Type Check Gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
      - run: npx tsc --noEmit
      - run: npm run lint -- --max-warnings=0
        continue-on-error: true

  typecheck-services:
    name: Type Check Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [users, gigs, orders, requests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install shared dependencies
        run: cd services/shared && npm install
      - name: Install service dependencies
        run: cd services/${{ matrix.service }} && npm install
      - name: Approve Prisma scripts
        run: cd services/${{ matrix.service }} && npm approve-scripts prisma @prisma/engines esbuild 2>/dev/null || true
      - name: Install again after approving scripts
        run: cd services/${{ matrix.service }} && npm install
      - name: Generate Prisma client
        run: cd services/${{ matrix.service }} && DATABASE_URL="postgresql://dummy:dummy@localhost:5432/dummy" npx prisma generate
      - name: Type check
        run: cd services/${{ matrix.service }} && npx tsc --noEmit

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
      - run: npm run test:unit

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [typecheck-gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
      - run: npx playwright install chromium
      - run: npm run test:e2e
        env:
          E2E_BASE_URL: "http://localhost:3000"
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [typecheck-gateway, typecheck-services]
    if: github.event_name == 'push'
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - service: app
            dockerfile: Dockerfile
            context: .
          - service: users-service
            dockerfile: services/users/Dockerfile
            context: .
          - service: gigs-service
            dockerfile: services/gigs/Dockerfile
            context: .
          - service: orders-service
            dockerfile: services/orders/Dockerfile
            context: .
          - service: requests-service
            dockerfile: services/requests/Dockerfile
            context: .
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Quay.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USER }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine image tag
        id: tag
        run: echo "sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}:${{ steps.tag.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  update-gitops:
    name: Update GitOps Manifests
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tags
        run: |
          SHORT_SHA=${GITHUB_SHA::8}
          BASE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          # Update app deployment
          sed -i "s|image: .*daddy-app:.*|image: ${BASE}-app:${SHORT_SHA}|g" gitops/base/app-deployment.yaml

          # Update service deployments
          for svc in users gigs orders requests; do
            sed -i "s|image: .*daddy-${svc}-service:.*|image: ${BASE}-${svc}-service:${SHORT_SHA}|g" gitops/base/${svc}-deployment.yaml
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/
          git diff --cached --quiet || git commit -m "chore: update images to ${GITHUB_SHA::8}"
          git push
