name: CI

on:
  push:
    branches: [main, dev, develop, feature/*]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  REGISTRY: quay.io
  IMAGE_NAME: ${{ secrets.QUAY_USER }}/daddy

jobs:
  security-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit BFF dependencies
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Audit service dependencies
        run: |
          for svc in users gigs orders requests; do
            echo "=== Auditing $svc ==="
            cd services/$svc && npm install && npm audit --audit-level=high || true
            cd ../..
          done
        continue-on-error: true

  typecheck-gateway:
    name: Type Check Gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
      - run: npx tsc --noEmit
      - run: npm run lint -- --max-warnings=0
        continue-on-error: true

  typecheck-services:
    name: Type Check Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [users, gigs, orders, requests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install shared dependencies
        run: cd services/shared && npm install
      - name: Install service dependencies
        run: cd services/${{ matrix.service }} && npm install
      - name: Approve Prisma scripts
        run: cd services/${{ matrix.service }} && npm approve-scripts prisma @prisma/engines esbuild 2>/dev/null || true
      - name: Install again after approving scripts
        run: cd services/${{ matrix.service }} && npm install
      - name: Generate Prisma client
        run: cd services/${{ matrix.service }} && DATABASE_URL="postgresql://dummy:dummy@localhost:5432/dummy" npx prisma generate
      - name: Type check
        run: cd services/${{ matrix.service }} && npx tsc --noEmit

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
      - run: npm run test:unit

  integration-tests:
    name: System & E2E Tests
    runs-on: ubuntu-latest
    needs: [typecheck-gateway, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Start services with docker-compose
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build
        timeout-minutes: 10

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to be ready..."
          for port in 4001 4002 4003 4004; do
            ready=false
            for i in $(seq 1 30); do
              if curl -sf http://localhost:$port/health > /dev/null 2>&1; then
                echo "Service on port $port is ready"
                ready=true
                break
              fi
              echo "Waiting for port $port... ($i/30)"
              sleep 2
            done
            if [ "$ready" = false ]; then
              echo "ERROR: Service on port $port did not start in time"
              docker compose -f docker-compose.yml -f docker-compose.ci.yml logs
              exit 1
            fi
          done

      - name: Run database migrations and seed
        run: |
          for svc in users gigs orders requests; do
            PORT_MAP=("users:4001" "gigs:4002" "orders:4003" "requests:4004")
            DB_MAP=("users:daddy_users" "gigs:daddy_gigs" "orders:daddy_orders" "requests:daddy_requests")
            for pair in "${DB_MAP[@]}"; do
              key="${pair%%:*}"
              db="${pair#*:}"
              if [ "$key" = "$svc" ]; then
                cd services/$svc
                DATABASE_URL="postgresql://daddy:daddypass123@localhost:5432/$db" npx prisma db push --skip-generate 2>/dev/null || true
                cd ../..
              fi
            done
          done

      - name: Seed databases
        run: |
          for svc in users gigs orders requests; do
            DB_MAP=("users:daddy_users" "gigs:daddy_gigs" "orders:daddy_orders" "requests:daddy_requests")
            for pair in "${DB_MAP[@]}"; do
              key="${pair%%:*}"
              db="${pair#*:}"
              if [ "$key" = "$svc" ]; then
                cd services/$svc
                DATABASE_URL="postgresql://daddy:daddypass123@localhost:5432/$db" npx prisma db seed 2>/dev/null || true
                cd ../..
              fi
            done
          done
        continue-on-error: true

      - name: Build and start Next.js app
        run: |
          npm run build
          npm start &
          echo "Waiting for Next.js on port 3000..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Next.js is ready"
              break
            fi
            sleep 2
          done
        env:
          DATABASE_URL: "postgresql://daddy:daddypass123@localhost:5432/daddy_users"
          AUTH_SECRET: "ci-test-secret-at-least-32-characters-long"
          AUTH_TRUST_HOST: "true"
          GOOGLE_CLIENT_ID: "test-google-client-id"
          GOOGLE_CLIENT_SECRET: "test-google-client-secret"
          USERS_SERVICE_URL: "http://localhost:4001"
          GIGS_SERVICE_URL: "http://localhost:4002"
          ORDERS_SERVICE_URL: "http://localhost:4003"
          REQUESTS_SERVICE_URL: "http://localhost:4004"

      - name: Run system tests
        run: npm run test:system
        env:
          TEST_BASE_URL: "http://localhost:3000"

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          E2E_BASE_URL: "http://localhost:3000"
        continue-on-error: true

      - name: Stop services
        if: always()
        run: docker compose down

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-results/
          retention-days: 7

  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [typecheck-gateway, typecheck-services, unit-tests]
    if: github.event_name == 'push'
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - service: app
            dockerfile: Dockerfile
            context: .
          - service: users-service
            dockerfile: services/users/Dockerfile
            context: .
          - service: gigs-service
            dockerfile: services/gigs/Dockerfile
            context: .
          - service: orders-service
            dockerfile: services/orders/Dockerfile
            context: .
          - service: requests-service
            dockerfile: services/requests/Dockerfile
            context: .
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Quay.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USER }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine image tag
        id: tag
        run: echo "sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}:${{ steps.tag.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  update-gitops:
    name: Update GitOps Manifests
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tags
        run: |
          SHORT_SHA=${GITHUB_SHA::8}
          BASE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          # Update app deployment
          sed -i "s|image: .*daddy-app:.*|image: ${BASE}-app:${SHORT_SHA}|g" gitops/base/app-deployment.yaml

          # Update service deployments
          for svc in users gigs orders requests; do
            sed -i "s|image: .*daddy-${svc}-service:.*|image: ${BASE}-${svc}-service:${SHORT_SHA}|g" gitops/base/${svc}-deployment.yaml
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/
          git diff --cached --quiet || git commit -m "chore: update images to ${GITHUB_SHA::8}"
          git push

  deploy:
    name: Deploy to OpenShift
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    steps:
      - name: Install oc CLI
        run: |
          curl -sL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz | tar xz
          sudo mv oc kubectl /usr/local/bin/

      - name: Log in to OpenShift
        run: oc login --token="${{ secrets.OPENSHIFT_TOKEN }}" --server="${{ secrets.OPENSHIFT_SERVER }}" --insecure-skip-tls-verify

      - name: Roll out new images
        run: |
          NS="${{ secrets.OPENSHIFT_NAMESPACE }}"
          TAG="${GITHUB_SHA::8}"
          BASE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          oc set image deployment/daddy-app daddy-app=${BASE}-app:${TAG} -n ${NS}
          oc set image deployment/users-service users-service=${BASE}-users-service:${TAG} -n ${NS}
          oc set image deployment/gigs-service gigs-service=${BASE}-gigs-service:${TAG} -n ${NS}
          oc set image deployment/orders-service orders-service=${BASE}-orders-service:${TAG} -n ${NS}
          oc set image deployment/requests-service requests-service=${BASE}-requests-service:${TAG} -n ${NS}

      - name: Wait for rollouts
        run: |
          NS="${{ secrets.OPENSHIFT_NAMESPACE }}"
          for dep in daddy-app users-service gigs-service orders-service requests-service; do
            oc rollout status deployment/${dep} -n ${NS} --timeout=120s
          done
