name: "CI: App (BFF)"

on:
  push:
    branches: [main, dev, stg]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "next.config.*"
      - "tailwind.config.*"
      - "postcss.config.*"
      - "Dockerfile"
      - "prisma/**"
      - "tests/**"
      - ".github/workflows/ci-app.yml"
  pull_request:
    branches: [main, dev, stg]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "next.config.*"
      - "tailwind.config.*"
      - "postcss.config.*"
      - "Dockerfile"
      - "prisma/**"
      - "tests/**"
      - ".github/workflows/ci-app.yml"
  workflow_dispatch:

concurrency:
  group: ci-app-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: quay.io
  IMAGE_NAME: ${{ secrets.QUAY_USER }}/daddy

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Approve Prisma scripts
        run: npm approve-scripts prisma @prisma/engines esbuild 2>/dev/null || true
      - run: npm install
      - run: npx prisma generate
      - run: npx tsc --noEmit

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    env:
      INTER_SERVICE_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Approve Prisma scripts
        run: npm approve-scripts prisma @prisma/engines esbuild 2>/dev/null || true
      - run: npm install
      - run: npx prisma generate
      - run: npm run test:unit

  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: [typecheck, unit-tests]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/stg' || github.ref == 'refs/heads/main')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Quay.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USER }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Determine image tag
        id: tag
        run: echo "sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-app:${{ steps.tag.outputs.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-app:${{ github.ref_name }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

  update-gitops:
    name: Update GitOps Manifests
    runs-on: ubuntu-latest
    needs: [build-and-push]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tag
        run: |
          SHORT_SHA=${GITHUB_SHA::8}
          BASE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          sed -i "s|image: .*daddy-app:.*|image: ${BASE}-app:${SHORT_SHA}|g" gitops/base/app-deployment.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/
          if git diff --cached --quiet; then
            echo "No gitops changes to commit"
            exit 0
          fi
          git commit -m "chore: update app image to ${GITHUB_SHA::8}"
          for i in 1 2 3; do
            git pull --rebase origin ${{ github.ref_name }} && git push && exit 0
            echo "Push attempt $i failed, retrying..."
            sleep 2
          done
          echo "Failed to push after 3 attempts"
          exit 1
