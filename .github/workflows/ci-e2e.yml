name: "CI: E2E Tests"

on:
  push:
    branches: [main, dev, stg]
  pull_request:
    branches: [main, dev, stg]
  workflow_dispatch:

concurrency:
  group: ci-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests:
    name: System & E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Pre-build service images with cache
        run: |
          for svc in users gigs orders requests chat; do
            docker buildx build \
              --file services/$svc/Dockerfile \
              --load \
              --cache-from type=gha,scope=ci-$svc \
              --cache-to type=gha,mode=max,scope=ci-$svc \
              -t daddy-$svc-service \
              .
          done
        env:
          DOCKER_BUILDKIT: "1"

      - name: Start services with docker-compose
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d
        timeout-minutes: 20
        env:
          INTER_SERVICE_SECRET: "test-secret-for-ci"

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to be ready..."
          for port in 4001 4002 4003 4004 4005; do
            ready=false
            for i in $(seq 1 60); do
              if curl -sf http://localhost:$port/health > /dev/null 2>&1; then
                echo "Service on port $port is ready"
                ready=true
                break
              fi
              echo "Waiting for port $port... ($i/60)"
              sleep 3
            done
            if [ "$ready" = false ]; then
              echo "ERROR: Service on port $port did not start in time"
              docker compose -f docker-compose.yml -f docker-compose.ci.yml logs
              exit 1
            fi
          done
          echo "Waiting for Redis on port 6379..."
          redis_ready=false
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T redis redis-cli ping | grep -q PONG; then
              echo "Redis is ready"
              redis_ready=true
              break
            fi
            echo "Waiting for Redis... ($i/30)"
            sleep 2
          done
          if [ "$redis_ready" = false ]; then
            echo "ERROR: Redis did not start in time"
            docker compose -f docker-compose.yml -f docker-compose.ci.yml logs redis
            exit 1
          fi

      - name: Install service dependencies for migrations
        run: |
          cd services/shared && npm install && cd ../..
          for svc in users gigs orders requests chat; do
            echo "=== Installing deps for $svc ==="
            cd services/$svc && npm install && cd ../..
          done

      - name: Run database migrations
        run: |
          for svc in users gigs orders requests chat; do
            DB_MAP=("users:daddy_users" "gigs:daddy_gigs" "orders:daddy_orders" "requests:daddy_requests" "chat:daddy_chat")
            for pair in "${DB_MAP[@]}"; do
              key="${pair%%:*}"
              db="${pair#*:}"
              if [ "$key" = "$svc" ]; then
                cd services/$svc
                echo "=== Pushing schema for $svc ($db) ==="
                DATABASE_URL="postgresql://daddy:daddypass123@localhost:5432/$db" npx prisma db push --accept-data-loss
                cd ../..
              fi
            done
          done

      - name: Generate Prisma clients and seed databases
        run: |
          for svc in users gigs orders requests chat; do
            DB_MAP=("users:daddy_users" "gigs:daddy_gigs" "orders:daddy_orders" "requests:daddy_requests" "chat:daddy_chat")
            for pair in "${DB_MAP[@]}"; do
              key="${pair%%:*}"
              db="${pair#*:}"
              if [ "$key" = "$svc" ]; then
                cd services/$svc
                echo "=== Generating Prisma client for $svc ==="
                DATABASE_URL="postgresql://daddy:daddypass123@localhost:5432/$db" npx prisma generate
                cd ../..
                echo "=== Seeding $svc ($db) ==="
                DATABASE_URL="postgresql://daddy:daddypass123@localhost:5432/$db" npx tsx services/$svc/src/seed.ts || true
              fi
            done
          done

      - name: Verify services respond after migrations
        run: |
          echo "=== Smoke-testing services ==="
          for port in 4001 4002 4003 4004 4005; do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:$port/health)
            echo "Port $port health: $status"
          done

      - name: Build and start Next.js app
        run: |
          npm run build
          npm start &
          echo "Waiting for Next.js on port 3000..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Next.js is ready"
              break
            fi
            sleep 2
          done
        env:
          DATABASE_URL: "postgresql://daddy:daddypass123@localhost:5432/daddy_users"
          AUTH_SECRET: "ci-test-secret-at-least-32-characters-long"
          AUTH_URL: "http://localhost:3000"
          NEXT_PUBLIC_BASE_URL: "http://localhost:3000"
          AUTH_TRUST_HOST: "true"
          REDIS_URL: "redis://localhost:6379"
          RATE_LIMIT_AUTH: "200"
          RATE_LIMIT_POST: "200"
          RATE_LIMIT_DEFAULT: "2000"
          GOOGLE_CLIENT_ID: "test-google-client-id"
          GOOGLE_CLIENT_SECRET: "test-google-client-secret"
          INTER_SERVICE_SECRET: "test-secret-for-ci"
          SKIP_CAPTCHA: "true"
          USERS_SERVICE_URL: "http://localhost:4001"
          GIGS_SERVICE_URL: "http://localhost:4002"
          ORDERS_SERVICE_URL: "http://localhost:4003"
          REQUESTS_SERVICE_URL: "http://localhost:4004"
          CHAT_SERVICE_URL: "http://localhost:4005"

      - name: Run system tests
        run: npm run test:system
        env:
          TEST_BASE_URL: "http://localhost:3000"

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          E2E_BASE_URL: "http://localhost:3000"

      - name: Show docker logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --tail=100

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-results/
          retention-days: 7
