name: "CI: Gateway"

on:
  push:
    branches: [main, dev, stg]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "prisma/**"
      - "next.config.*"
      - "tsconfig.json"
      - "tailwind.config.*"
      - "postcss.config.*"
      - "public/**"
      - "Dockerfile"
      - ".github/workflows/ci-gateway.yml"
  pull_request:
    branches: [main, dev, stg]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "prisma/**"
      - "next.config.*"
      - "tsconfig.json"
      - "tailwind.config.*"
      - "postcss.config.*"
      - "public/**"
      - "Dockerfile"
      - ".github/workflows/ci-gateway.yml"
  workflow_dispatch:

concurrency:
  group: ci-gateway-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: quay.io
  IMAGE_NAME: ${{ secrets.QUAY_USER }}/daddy

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
      - run: npx tsc --noEmit
      - run: npm run lint -- --max-warnings=0
        continue-on-error: true

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high || true
        continue-on-error: true

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
      - run: npm run test:unit
        env:
          INTER_SERVICE_SECRET: "test-secret-for-ci"

  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: [typecheck, unit-tests]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/stg' || github.ref == 'refs/heads/main')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Quay.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USER }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Determine image tag
        id: tag
        run: echo "sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-app:${{ steps.tag.outputs.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-app:${{ github.ref_name }}
          build-args: |
            NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ secrets.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
            NEXT_PUBLIC_UMAMI_URL=${{ secrets.NEXT_PUBLIC_UMAMI_URL }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

  update-gitops:
    name: Update GitOps Manifests
    runs-on: ubuntu-latest
    needs: [build-and-push]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for E2E to pass
        run: |
          echo "Waiting for E2E workflow to complete for commit ${GITHUB_SHA::8}..."
          for i in $(seq 1 60); do
            result=$(gh run list \
              --workflow=ci-e2e.yml \
              --branch="${{ github.ref_name }}" \
              --json headSha,conclusion,status \
              --jq "[.[] | select(.headSha == \"$GITHUB_SHA\")] | .[0] | .conclusion // .status // \"not_found\"")
            if [ "$result" = "success" ]; then
              echo "E2E passed — proceeding with GitOps update"
              exit 0
            elif [ "$result" = "failure" ]; then
              echo "E2E failed — blocking GitOps update"
              exit 1
            fi
            echo "E2E status: $result — waiting... ($i/60)"
            sleep 30
          done
          echo "E2E did not complete within 30 minutes — blocking GitOps update"
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tag
        run: |
          SHORT_SHA=${GITHUB_SHA::8}
          BASE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          sed -i "s|image: .*daddy-app:.*|image: ${BASE}-app:${SHORT_SHA}|g" gitops/base/app-deployment.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/
          if git diff --cached --quiet; then
            echo "No gitops changes to commit"
            exit 0
          fi
          git commit -m "chore: update app image to ${GITHUB_SHA::8}"
          for i in 1 2 3; do
            git pull --rebase origin ${{ github.ref_name }} && git push && exit 0
            echo "Push attempt $i failed, retrying..."
            sleep 2
          done
          echo "Failed to push after 3 attempts"
          exit 1
