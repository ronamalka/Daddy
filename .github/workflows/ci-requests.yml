name: "CI: Requests Service"

on:
  push:
    branches: [main, dev, stg]
    paths:
      - "services/requests/**"
      - "services/shared/**"
      - ".github/workflows/ci-requests.yml"
  pull_request:
    branches: [main, dev, stg]
    paths:
      - "services/requests/**"
      - "services/shared/**"
      - ".github/workflows/ci-requests.yml"
  workflow_dispatch:

concurrency:
  group: ci-requests-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: quay.io
  IMAGE_NAME: ${{ secrets.QUAY_USER }}/daddy

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install shared dependencies
        run: cd services/shared && npm install
      - name: Install service dependencies
        run: cd services/requests && npm install
      - name: Approve Prisma scripts
        run: cd services/requests && npm approve-scripts prisma @prisma/engines esbuild 2>/dev/null || true
      - name: Install again after approving scripts
        run: cd services/requests && npm install
      - name: Generate Prisma client
        run: cd services/requests && DATABASE_URL="postgresql://dummy:dummy@localhost:5432/dummy" npx prisma generate
      - name: Type check
        run: cd services/requests && npx tsc --noEmit

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: cd services/shared && npm install && cd ../requests && npm install && npm audit --audit-level=high || true
        continue-on-error: true

  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: [typecheck]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/stg' || github.ref == 'refs/heads/main')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Quay.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USER }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Determine image tag
        id: tag
        run: echo "sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/requests/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-requests-service:${{ steps.tag.outputs.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-requests-service:${{ github.ref_name }}
          cache-from: type=gha,scope=requests-service
          cache-to: type=gha,mode=max,scope=requests-service

  update-gitops:
    name: Update GitOps Manifests
    runs-on: ubuntu-latest
    needs: [build-and-push]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tag
        run: |
          SHORT_SHA=${GITHUB_SHA::8}
          BASE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          sed -i "s|image: .*daddy-requests-service:.*|image: ${BASE}-requests-service:${SHORT_SHA}|g" gitops/base/requests-deployment.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/
          if git diff --cached --quiet; then
            echo "No gitops changes to commit"
            exit 0
          fi
          git commit -m "chore: update requests-service image to ${GITHUB_SHA::8}"
          for i in 1 2 3; do
            git pull --rebase origin ${{ github.ref_name }} && git push && exit 0
            echo "Push attempt $i failed, retrying..."
            sleep 2
          done
          echo "Failed to push after 3 attempts"
          exit 1
